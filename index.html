<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UNITS</title>
<style>
  :root {
    --bg: #0B0B0B; --surface: #171514; --surface-2: #201C1A; --border: #332D29;
    --text: #F6EBD7; --text-dim: #B8A99A; --text-faint: #7A6D62;
    --accent: #FF7A3D; --accent-dark: #3D2011; --accent-text: #1F0E05;
    --danger: #EF3B3B; --danger-dark: #3A1414;
    --gold: #FFC629;
    --font-head: 'Helvetica Neue', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-head); -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; overflow-x: hidden; width: 100%; }
  #app { min-height: 100vh; padding-bottom: 50px; }
  input, button { font-family: var(--font-head); }

  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 16px 16px 0; border-bottom: 1px solid var(--border); }
  header.top .row1 { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  header.top h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.01em; text-transform: uppercase; color: var(--text); }
  header.top h1 span { background: linear-gradient(135deg, #FFC629, #EF3B3B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand { display: flex; align-items: center; gap: 8px; }
  header.top .who { font-size: 12px; color: var(--text-dim); }

  .tabbar { display: flex; gap: 4px; }
  .tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 12px; font-weight: 700; color: var(--text-faint); border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.02em; }
  .tab.active { color: var(--accent); border-color: var(--accent); }

  .league-scroller { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 8px; scrollbar-width: none; }
  .league-scroller::-webkit-scrollbar { display: none; }
  .league-pill { flex: 0 0 auto; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); font-size: 11px; font-weight: 700; white-space: nowrap; text-transform: uppercase; }
  .league-pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .league-pill.off { opacity: 0.5; }

  main { padding: 4px 16px 8px; }

  .offseason-card { text-align: center; padding: 50px 20px; color: var(--text-dim); }
  .offseason-card .big { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .offseason-card .small { font-size: 12.5px; }

  .event-card { background: var(--surface); border-radius: 10px; padding: 12px; margin-top: 10px; border: 1px solid var(--border); }
  .event-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .event-meta { font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.03em; }
  .event-meta.live { color: var(--danger); font-weight: 700; }

  .team-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
  .team-name { font-size: 14.5px; font-weight: 700; }
  .team-score { font-family: var(--font-mono); font-size: 15px; font-weight: 700; min-width: 24px; text-align: right; }
  .team-row.winner .team-name { color: var(--accent); }
  .team-row.loser .team-name { color: var(--text-dim); }

  .outcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .outcome-btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 8px 6px; text-align: center; color: var(--text); }
  .outcome-btn .oc-team { font-size: 11.5px; font-weight: 700; color: var(--text-dim); margin-bottom: 3px; }
  .outcome-btn .oc-line { font-family: var(--font-mono); font-size: 15px; font-weight: 700; }
  .outcome-btn .oc-odds { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .outcome-btn.selected { background: var(--accent); border-color: var(--accent); }
  .outcome-btn.selected .oc-team, .outcome-btn.selected .oc-line, .outcome-btn.selected .oc-odds { color: var(--accent-text); }
  .outcome-btn.disabled { opacity: 0.45; }

  .bet-slip { margin-top: 10px; background: var(--surface-2); border-radius: 8px; padding: 10px; }
  .bs-row { display: flex; align-items: center; gap: 8px; }
  .bs-row label { font-size: 11.5px; color: var(--text-dim); font-weight: 600; }
  .bs-row input { width: 58px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 8px; font-family: var(--font-mono); font-size: 14px; }
  .bs-row .to-win { flex: 1; text-align: right; font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
  .bs-row .to-win .lbl { color: var(--text-faint); font-family: var(--font-head); font-size: 10.5px; display: block; text-transform: uppercase; }
  .lock-btn { width: 100%; margin-top: 9px; background: var(--accent); border: none; color: var(--accent-text); border-radius: 6px; padding: 10px; font-size: 13.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
  .lock-btn:disabled { opacity: 0.35; }
  .pick-error { color: var(--danger); font-size: 11px; margin-top: 6px; }

  .locked-note { margin-top: 10px; background: var(--accent-dark); border: 1px solid var(--accent); border-radius: 8px; padding: 10px; font-size: 12.5px; color: var(--accent); }
  .locked-note .ln-title { font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.03em; margin-bottom: 3px; color: var(--text-dim); }
  .locked-note b { font-family: var(--font-mono); }
  .no-odds-note { margin-top: 8px; font-size: 11.5px; color: var(--text-faint); font-style: italic; }

  .setup-card { background: var(--surface); border-radius: 10px; padding: 16px; margin-top: 8px; border: 1px solid var(--border); }
  .setup-card label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; margin-top: 12px; }
  .setup-card label:first-child { margin-top: 0; }
  .setup-card input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 9px 10px; font-size: 14px; }
  .setup-card .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .setup-card button { flex: 1; padding: 10px; border-radius: 6px; font-size: 13.5px; font-weight: 800; border: none; background: var(--accent); color: var(--accent-text); text-transform: uppercase; }
  .setup-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 10px; line-height: 1.5; }

  .rank-banner { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .rank-cell { flex: 1; padding: 12px; text-align: center; }
  .rank-cell + .rank-cell { border-left: 1px solid var(--border); }
  .rank-cell .rc-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .rank-cell .rc-value { font-family: var(--font-mono); font-size: 20px; font-weight: 800; color: var(--text); }
  .rank-cell .rc-value.accent { color: var(--accent); }
  .rank-cell .rc-sub { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }

  .pick-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); background: var(--surface); border-radius: 8px; margin-top: 8px; border: 1px solid var(--border); }
  .pick-row .who { font-size: 13.5px; font-weight: 700; }
  .pick-row .who .pick-league { display: inline-block; background: var(--surface-2); color: var(--accent); font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-right: 6px; text-transform: uppercase; letter-spacing: 0.02em; vertical-align: middle; }
  .pick-row .detail { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; font-family: var(--font-mono); }
  .pick-row .result { font-family: var(--font-mono); font-size: 15px; font-weight: 800; text-align: right; white-space: nowrap; }
  .pick-row .result .sub { display: block; font-size: 9.5px; color: var(--text-faint); font-weight: 500; text-transform: uppercase; font-family: var(--font-head); }
  .result.win { color: var(--accent); }
  .result.loss { color: var(--danger); }
  .result.pending { color: var(--gold); }
  .result.profit-pos { color: #4CAF50; }
  .result.profit-neg { color: var(--danger); }

  .week-header { font-size: 12.5px; font-weight: 800; color: var(--text-dim); margin: 18px 0 2px; text-transform: uppercase; letter-spacing: 0.03em; }
  .week-header:first-child { margin-top: 8px; }

  .lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-bottom: 1px solid var(--border); background: var(--surface); margin-top: 8px; border-radius: 8px; border: 1px solid var(--border); }
  .lb-row.me { border-color: var(--accent); }
  .lb-rank { font-family: var(--font-mono); font-size: 14px; color: var(--text-faint); width: 20px; }
  .lb-rank.first { color: var(--gold); font-weight: 800; }
  .lb-name { flex: 1; font-size: 14.5px; font-weight: 700; }
  .lb-record { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }
  .lb-profit { font-family: var(--font-mono); font-size: 16px; font-weight: 800; min-width: 60px; text-align: right; }
  .lb-profit.pos { color: var(--accent); }
  .lb-profit.neg { color: var(--danger); }

  .empty { text-align: center; padding: 50px 20px; color: var(--text-faint); font-size: 14px; }
  .stats-table { width: 100%; border-collapse: collapse; margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .stats-table th { text-align: left; font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .stats-table td { padding: 9px 10px; font-size: 13px; font-family: var(--font-mono); border-bottom: 1px solid var(--border); color: var(--text); }
  .stats-table tr:last-child td { border-bottom: none; }
  .stats-table td.pos { color: var(--accent); }
  .stats-table td.neg { color: var(--danger); }
  .refresh-note { margin: 16px 0 0; padding: 11px 13px; background: var(--surface); border-radius: 8px; font-size: 11px; color: var(--text-faint); line-height: 1.5; border-left: 2px solid var(--accent-dark); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
</style>

];

let DATA = { nfl: [], mlb: [], ncaaf: [] };
const gameIndex = {};
function rebuildGameIndex() {
  Object.keys(gameIndex).forEach(k => delete gameIndex[k]);
  Object.keys(DATA).forEach(sport => (DATA[sport] || []).forEach(g => gameIndex[g.id] = { sport, game: g }));
}

// ---------- live game list + scores (ESPN public scoreboard) ----------
const ESPN_PATHS = {
  nfl: { sport: 'football', league: 'nfl' },
  mlb: { sport: 'baseball', league: 'mlb' },
  ncaaf: { sport: 'football', league: 'college-football' },
  nba: { sport: 'basketball', league: 'nba' },
  nhl: { sport: 'hockey', league: 'nhl' },
  ncaab: { sport: 'basketball', league: 'mens-college-basketball' },
};
async function fetchSportGames(sport) {
  const { sport: espnSport, league } = ESPN_PATHS[sport];
  const now = new Date();
  const dateStrs = [0, 1, 2, 3, 4, 5, 6].map(offset => {
    const d = new Date(now);
    d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0, 10).replace(/-/g, '');
  });
  const seen = new Set();
  const events = [];
  for (const date of dateStrs) {
    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${espnSport}/${league}/scoreboard?dates=${date}&limit=300`);
      if (!res.ok) continue;
      const json = await res.json();
      (json.events || []).forEach(ev => { if (!seen.has(ev.id)) { seen.add(ev.id); events.push(ev); } });
    } catch (e) { /* best-effort per date */ }
  }
  return events.map(ev => {
    const comp = ev.competitions && ev.competitions[0];
    if (!comp) return null;
    const home = comp.competitors && comp.competitors.find(c => c.homeAway === 'home');
    const away = comp.competitors && comp.competitors.find(c => c.homeAway === 'away');
    if (!home || !away || !home.team || !away.team) return null;
    const homeAbbr = home.team.abbreviation, awayAbbr = away.team.abbreviation;
    const state = ev.status && ev.status.type && ev.status.type.state;
    const status = state === 'post' ? 'closed' : (state === 'in' ? 'inprogress' : 'scheduled');
    const odds = comp.odds && comp.odds[0];
    const extractPitcher = (competitor) => {
      try {
        const p = competitor.probables && competitor.probables[0];
        if (p && p.athlete) return p.athlete.shortName || p.athlete.displayName || null;
        if (p && p.displayName) return p.displayName;
      } catch (e) { /* field not present in this response */ }
      return null;
    };
    const g = {
      id: ev.id,
      status,
      home: homeAbbr, away: awayAbbr,
      teams: { [homeAbbr]: { name: home.team.displayName }, [awayAbbr]: { name: away.team.displayName } },
      start: ev.date,
      local_start: new Date(ev.date).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
      title: (comp.notes && comp.notes[0] && comp.notes[0].headline) || null,
      liveDetail: state === 'in' ? ((ev.status.type && ev.status.type.shortDetail) || null) : null,
      oddsDetails: (odds && odds.details) || null,
      overUnder: (odds && typeof odds.overUnder === 'number') ? odds.overUnder : null,
      homePitcher: sport === 'mlb' ? extractPitcher(home) : null,
      awayPitcher: sport === 'mlb' ? extractPitcher(away) : null,
    };
    if (status !== 'scheduled') {
      g.score = { [homeAbbr]: Number(home.score), [awayAbbr]: Number(away.score) };
    }
    return g;
  }).filter(Boolean);
}
let gamesLoaded = false;
async function refreshGameLists() {
  const before = JSON.stringify(DATA);
  for (const sport of Object.keys(ESPN_PATHS)) {
    const meta = LEAGUES_META.find(l => l.id === sport);
    if (!meta || !meta.active) continue;
    try {
      const games = await fetchSportGames(sport);
      if (games.length) DATA[sport] = games;
    } catch (e) { /* keep previous list for this sport on failure */ }
  }
  rebuildGameIndex();
  gamesLoaded = true;
  return JSON.stringify(DATA) !== before;
}

let liveTimer = null;
function startLiveScoreChecks() {
  refreshGameLists().then(async () => { await persistNewlySettledPicks(); await persistNewlySettledWeeklyBets(); if (profile) render(); });
  if (liveTimer) return;
  liveTimer = setInterval(async () => {
    if (pendingSaveCount > 0) return; // don't rebuild the screen while a bet is mid-save
    const dataChanged = await refreshGameLists();
    const settledA = await persistNewlySettledPicks();
    const settledB = await persistNewlySettledWeeklyBets();
    if (profile && (dataChanged || settledA || settledB)) render();
  }, 60000);
}

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

function mondayOf(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function weekLabel(d) { return 'Week of ' + mondayOf(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function weekKey(d) { return mondayOf(d).toISOString().slice(0,10); }
function inDateRange(date, mode) {
  if (mode === 'all') return true;
  const now = new Date();
  if (mode === 'day') return date.toDateString() === now.toDateString();
  if (mode === 'week') return weekKey(date) === weekKey(now);
  if (mode === 'year') return date.getFullYear() === now.getFullYear();
  return true;
}

// ---------- spread from real ESPN posted line (payout is flat 1:1, no odds weighting) ----------
function fmtUnits(n) {
  const r = Math.round(n * 100) / 100;
  return (r > 0 ? '+' : '') + r.toFixed(2) + 'u';
}
// Returns spread as the HOME team's number: negative = home favored, positive = home underdog. null = no posted line.
function computeSpread(sport, g) {
  const meta = LEAGUES_META.find(l => l.id === sport);
  if (!meta || !meta.spreadSport) return null;
  if (!g.oddsDetails) return null;
  const m = g.oddsDetails.match(/^([A-Za-z.]+)\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const favTeam = m[1].toUpperCase();
  const magnitude = Math.abs(parseFloat(m[2]));
  if (favTeam === (g.home || '').toUpperCase()) return -magnitude;
  if (favTeam === (g.away || '').toUpperCase()) return magnitude;
  return null;
}
function spreadLabelForSide(sport, g, ab) {
  const spread = computeSpread(sport, g);
  if (spread === null) return null;
  const val = ab === g.home ? spread : -spread;
  return val === 0 ? 'PK' : (val > 0 ? '+' + val : val.toString());
}
function pickSpreadDisplay(p) {
  if (p.spreadLabel) return p.spreadLabel;
  const idx = gameIndex[p.gameId];
  if (!idx) return null;
  return spreadLabelForSide(idx.sport, idx.game, p.sideAbbr);
}

  catch(e) { profile = null; }
}

}

}

  } finally {
    pendingSaveCount--;

}

let pollTimer = null;
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    if (pendingSaveCount > 0) return; // a local write is still in flight — don't clobber it with a stale read
    try {
      const data = await fsGet();
      let changed = false;
      if (data.players && JSON.stringify(data.players) !== JSON.stringify(players)) { players = data.players; changed = true; }
      if (data.picks && JSON.stringify(data.picks) !== JSON.stringify(allPicks)) { allPicks = data.picks; changed = true; }
      if (changed && profile) render();
    } catch (e) { /* ignore transient poll errors */ }
  }, 8000);
}

// ---------- House Bank: 100 units/week, confidence chips, spread + total bets ----------
function houseWeekStart(d) {
  const dt = new Date(d);
  const day = dt.getDay(); // 0=Sun..6=Sat
  const diff = (day + 5) % 7; // days since most recent Tuesday
  dt.setDate(dt.getDate() - diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function houseWeekKey(d) { return houseWeekStart(d).toISOString().slice(0,10); }
function weekRangeLabel(wk) {
  return new Date(wk + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function chipsFor(units) {
  return '\ud83d\udd25'.repeat(Math.max(0, Math.min(3, Math.round(units))));
}

function houseDayKey(d) { const dt = new Date(d); dt.setHours(0,0,0,0); return dt.toISOString().slice(0,10); }
function seededRandom(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) h = (Math.imul(31, h) + seedStr.charCodeAt(i)) | 0;
  return function() {
    h = Math.imul(h ^ (h >>> 15), h | 1);
    h ^= h + Math.imul(h ^ (h >>> 7), h | 61);
    return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
  };
}
let cachedDailyPool = null;
let cachedDailyPoolKey = null;
function dailyOptionPool() {
  const dayKey = houseDayKey(new Date());
  if (cachedDailyPoolKey === dayKey && cachedDailyPool) return cachedDailyPool;
  const rand = seededRandom(dayKey);
  const pool = [];
  LEAGUES_META.filter(l => l.active).forEach(lg => {
    (DATA[lg.id] || []).forEach(g => {
      if (g.status !== 'scheduled') return;
      if (houseDayKey(new Date(g.start)) !== dayKey) return;
      const spreadVal = computeSpread(lg.id, g);
      if (spreadVal !== null) {
        const side = rand() < 0.5 ? g.home : g.away;
        const line = side === g.home ? spreadVal : -spreadVal;
        pool.push({ sport: lg.id, gameId: g.id, betType: 'spread', side, line, label: `${side} ${line === 0 ? 'PK' : (line > 0 ? '+' + line : line)}`, gameLabel: g.away + ' @ ' + g.home });
      }
      const totalVal = g.overUnder;
      if (totalVal !== null && totalVal !== undefined) {
        const side = rand() < 0.5 ? 'OVER' : 'UNDER';
        pool.push({ sport: lg.id, gameId: g.id, betType: 'total', side, line: totalVal, label: `${side === 'OVER' ? 'Over' : 'Under'} ${totalVal}`, gameLabel: g.away + ' @ ' + g.home });
      }
    });
  });
  cachedDailyPool = pool;
  cachedDailyPoolKey = dayKey;
  return pool;
}
let cachedDailySlate = null;
let cachedDailySlateKey = null;
function dailyBaseSlate() {
  const dayKey = houseDayKey(new Date());
  if (cachedDailySlateKey === dayKey) return cachedDailySlate;
  const pool = dailyOptionPool();
  if (pool.length < 5) { cachedDailySlate = null; cachedDailySlateKey = dayKey; return null; }
  const rand = seededRandom(dayKey + '_slate');
  const shuffled = pool.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  cachedDailySlate = shuffled.slice(0, 5);
  cachedDailySlateKey = dayKey;
  return cachedDailySlate;
}
function mulliganFor(name, dayKey) {
  return allPicks.find(p => p.poolType === 'mulligan' && p.player === name && p.dayKey === dayKey);
}
function dailyOptionsForUser(name) {
  const base = dailyBaseSlate();
  if (!base) return null;
  const dayKey = houseDayKey(new Date());
  const mull = mulliganFor(name, dayKey);
  if (!mull) return base;
  const idx = base.findIndex(o => o.gameId === mull.replacedGameId && o.betType === mull.replacedBetType);
  if (idx === -1) return base;
  const copy = base.slice();
  copy[idx] = mull.newOption;
  return copy;
}
function weeklyBetsFor(name, wk) {
  return allPicks.filter(p => p.player === name && p.poolType === 'weekly' && p.weekKey === wk);
}
function weeklyUnitsUsed(name, wk) { return weeklyBetsFor(name, wk).reduce((s,p) => s + p.units, 0); }
function weeklyRemaining(name, wk) { return Math.max(0, HOUSE_BANK_TOTAL - weeklyUnitsUsed(name, wk)); }

function settleWeeklyBet(p) {
  if (p.settledResult) return p.settledResult;
  const idx = gameIndex[p.gameId];
  if (!idx) return { status: 'pending' };
  const g = idx.game;
  if (g.status !== 'closed' && g.status !== 'complete') return { status: 'pending' };
  const homeScore = g.score?.[g.home], awayScore = g.score?.[g.away];
  if (homeScore === undefined || awayScore === undefined) return { status: 'pending' };
  let outcome;
  if (p.betType === 'total') {
    const total = homeScore + awayScore;
    const diff = total - p.line;
    if (diff === 0) outcome = 'push';
    else if (p.sideAbbr === 'OVER') outcome = diff > 0 ? 'win' : 'loss';
    else outcome = diff < 0 ? 'win' : 'loss';
  } else {
    const teamScore = p.sideAbbr === g.home ? homeScore : awayScore;
    const oppScore = p.sideAbbr === g.home ? awayScore : homeScore;
    const margin = (teamScore - oppScore) + p.line;
    outcome = margin > 0 ? 'win' : (margin < 0 ? 'loss' : 'push');
  }
  if (outcome === 'push') return { status: 'push' };
  return { status: outcome, profit: outcome === 'win' ? p.units : -p.units };
}
async function persistNewlySettledWeeklyBets() {
  let changed = false;
  allPicks.forEach(p => {
    if (p.poolType !== 'weekly' || p.settledResult) return;
    const r = settleWeeklyBet(p);
    if (r.status !== 'pending') { p.settledResult = r; changed = true; }
  });
  if (changed) { try { await savePicks(allPicks); } catch (e) { /* retry next cycle */ } }
  return changed;
}
function weeklyNetUnits(name, wk) {
  return weeklyBetsFor(name, wk).reduce((s,p) => {
    const r = settleWeeklyBet(p);
    return s + (r.status === 'win' || r.status === 'loss' ? r.profit : 0);
  }, 0);
}
function weeklyAllSettled(name, wk) {
  const bets = weeklyBetsFor(name, wk);
  if (!bets.length) return false;
  return bets.every(p => settleWeeklyBet(p).status !== 'pending');
}
function allWeekKeysFor(name) {
  return [...new Set(allPicks.filter(p => p.player === name && p.poolType === 'weekly').map(p => p.weekKey))].sort();
}
function totalUnitsWon(name) {
  return allWeekKeysFor(name).reduce((s,wk) => weeklyAllSettled(name, wk) ? s + weeklyNetUnits(name, wk) : s, 0);
}
function positiveStreak(name) {
  const weeks = allWeekKeysFor(name).slice().sort().reverse();
  let streak = 0;
  for (const wk of weeks) {
    if (!weeklyAllSettled(name, wk)) continue;
    if (weeklyNetUnits(name, wk) > 0) streak++;
    else break;
  }
  return streak;
}
function weeklyLeaderboard(wk) {
  const names = players.length ? players.slice() : [];
  if (profile && !names.includes(profile.name)) names.push(profile.name);
  return names.map(n => ({ name: n, net: weeklyNetUnits(n, wk) })).sort((a,b) => b.net - a.net);
}

// ---------- Tracker: screenshot import via Claude vision, works with any sportsbook ----------
function trackerBetsFor(name) {
  return allPicks.filter(p => p.player === name && p.poolType === 'tracker');
}
function normTeamName(s) { return (s || '').toLowerCase().replace(/[^a-z]/g, ''); }
function matchGameForBet(matchupText) {
  if (!matchupText) return null;
  const norm = normTeamName(matchupText);
  let best = null;
  Object.keys(DATA).forEach(sport => {
    (DATA[sport] || []).forEach(g => {
      const homeName = normTeamName(g.teams[g.home]?.name);
      const awayName = normTeamName(g.teams[g.away]?.name);
      const homeAbbr = normTeamName(g.home), awayAbbr = normTeamName(g.away);
      const homeHit = homeName && norm.includes(homeName.slice(-6)) || (homeAbbr.length >= 3 && norm.includes(homeAbbr));
      const awayHit = awayName && norm.includes(awayName.slice(-6)) || (awayAbbr.length >= 3 && norm.includes(awayAbbr));
      if (homeHit && awayHit) best = { sport, gameId: g.id };
    });
  });
  return best;
}
async function fetchGamesForDate(sport, dateStr) {
  const paths = ESPN_PATHS[sport];
  if (!paths) return [];
  const compact = dateStr.replace(/-/g, '');
  try {
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${paths.sport}/${paths.league}/scoreboard?dates=${compact}&limit=300`);
    if (!res.ok) return [];
    const json = await res.json();
    return (json.events || []).map(ev => {
      const comp = ev.competitions && ev.competitions[0];
      if (!comp) return null;
      const home = comp.competitors && comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors && comp.competitors.find(c => c.homeAway === 'away');
      if (!home || !away || !home.team || !away.team) return null;
      return {
        id: ev.id,
        home: home.team.abbreviation, away: away.team.abbreviation,
        homeName: home.team.displayName, awayName: away.team.displayName
      };
    }).filter(Boolean);
  } catch (e) { return []; }
}
function betProfit(p) {
  if (p.status !== 'settled' || p.payout === null || p.payout === undefined) return null;
  return p.payout - p.cost;
}
function localDateKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function trackerHistoryChronological(name) {
  return trackerBetsFor(name)
    .map(p => ({ p, profit: betProfit(p), date: p.placedAt ? new Date(p.placedAt + 'T00:00:00') : new Date(p.timestamp) }))
    .sort((a,b) => a.date - b.date);
}
function inTrackerDateRange(date, mode) {
  if (mode === 'all') return true;
  if (/^\d{4}-\d{2}-\d{2}$/.test(mode)) return localDateKey(date) === mode;
  const now = new Date();
  if (mode === 'week') return weekKey(date) === weekKey(now);
  if (mode === 'month') return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth();
  if (mode === 'year') return date.getFullYear() === now.getFullYear();
  return true;
}
function trackerDailyTotals(entries) {
  const settled = entries.filter(e => e.profit !== null);
  const byDay = {};
  settled.forEach(e => {
    const key = localDateKey(e.date);
    byDay[key] = (byDay[key] || 0) + e.profit;
  });
  return Object.keys(byDay).sort().map(key => ({ dateKey: key, profit: byDay[key] }));
}
function renderProfitTrendBareSVG(days) {
  if (!days.length) return '<div class="empty" style="padding:24px 10px;">No settled bets in this range.</div>';
  const w = 320, h = 150, padL = 38, padR = 8, padT = 10, padB = 28;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  let cum = 0;
  const pts = days.map(d => { cum += d.profit; return cum; });
  const minV = Math.min(0, ...pts), maxV = Math.max(0, ...pts);
  const range = (maxV - minV) || 1;
  const n = pts.length;
  const xScale = i => padL + (n <= 1 ? innerW / 2 : (i / (n - 1)) * innerW);
  const yScale = v => padT + innerH - ((v - minV) / range) * innerH;
  const d = pts.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i).toFixed(1)} ${yScale(v).toFixed(1)}`).join(' ');
  const zeroY = yScale(0);
  const last = pts[pts.length - 1];
  const fmtDate = k => new Date(k + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const labelIdxs = n <= 4 ? days.map((_,i) => i) : [0, Math.floor((n-1)/2), n-1];
  const labels = labelIdxs.map(i => `<text x="${xScale(i).toFixed(1)}" y="${h - 6}" font-size="9" text-anchor="middle" style="fill:var(--text-faint)" font-family="var(--font-mono)">${fmtDate(days[i].dateKey)}</text>`).join('');
  const dots = pts.map((v,i) => `<circle cx="${xScale(i).toFixed(1)}" cy="${yScale(v).toFixed(1)}" r="3" style="fill:${last >= 0 ? '#4CAF50' : 'var(--danger)'}"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${zeroY}" x2="${padL + innerW}" y2="${zeroY}" style="stroke:var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="2" y="${zeroY + 3}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">$0</text>
    <text x="2" y="${padT + 8}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">${maxV.toFixed(0)}</text>
    <path d="${d}" fill="none" style="stroke:${last >= 0 ? '#4CAF50' : 'var(--danger)'}" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}
function renderProfitChart(days) {
  const container = el('div');

  svgHolder.innerHTML = renderProfitTrendBareSVG(days);

  if (days.length) {

    const innerW = W - padL - padR;
    const n = days.length;
    const xScale = i => padL + (n <= 1 ? innerW / 2 : (i / (n - 1)) * innerW);
    const slotWidthPct = Math.max((innerW / W) * 100 / n, 4);

    });
    container.appendChild(overlay);
  }
  return container;
}

    const isML = betTypeSel.value === 'moneyline';
    lineInput.style.display = isML ? 'none' : '';
    lineLabel.style.display = isML ? 'none' : '';
    lineLabel.textContent = betTypeSel.value === 'total' ? 'Total line' : 'Spread';
  }
  function revealStepsAfterMatchup(hasMatchup) {
    step3.style.display = hasMatchup ? 'block' : 'none';
    step4.style.display = hasMatchup ? 'block' : 'none';
    if (hasMatchup) { refreshSideOptions(); updateLineVisibility(); }
  }

  async function loadGames() {
    matchupWrap.style.display = 'none'; noGamesNote.style.display = 'none'; manualMatchupInput.style.display = 'none';
    revealStepsAfterMatchup(false);
    gamesForDate = [];
    if (!dateInput.value || !leagueSel.value) return;
    loadingNote.style.display = 'block';
    gamesForDate = await fetchGamesForDate(leagueSel.value, dateInput.value);
    loadingNote.style.display = 'none';
    if (gamesForDate.length) {
      matchupSel.innerHTML = '';
      const blank = document.createElement('option'); blank.value = ''; blank.textContent = 'Select a matchup…'; matchupSel.appendChild(blank);
      gamesForDate.forEach(g => { const o = document.createElement('option'); o.value = g.id; o.textContent = `${g.awayName} @ ${g.homeName}`; matchupSel.appendChild(o); });
      matchupWrap.style.display = 'block';
    } else {
      noGamesNote.style.display = 'block';
      manualMatchupInput.style.display = 'block';
    }
  }
  dateInput.onchange = loadGames;
  leagueSel.onchange = loadGames;
  matchupSel.onchange = () => revealStepsAfterMatchup(!!matchupSel.value);
  manualMatchupInput.oninput = () => revealStepsAfterMatchup(!!manualMatchupInput.value);
  betTypeSel.onchange = () => { refreshSideOptions(); updateLineVisibility(); };

  const errEl = el('div', 'pick-error');
  card.appendChild(errEl);

  function buildCurrentLeg() {
    const matchupText = matchupSel.value ? matchupSel.options[matchupSel.selectedIndex].textContent : manualMatchupInput.value;
    if (!matchupText) { errEl.textContent = 'Pick or enter a matchup first.'; return null; }
    if (betTypeSel.value !== 'moneyline' && !lineInput.value) { errEl.textContent = 'Enter the line.'; return null; }
    const g = gamesForDate.find(x => x.id === matchupSel.value);
    const sideLabelText = sideSel.options[sideSel.selectedIndex] ? sideSel.options[sideSel.selectedIndex].textContent : sideSel.value;
    let selectionText;
    if (betTypeSel.value === 'total') selectionText = (sideSel.value === 'OVER' ? 'Over' : 'Under') + ' ' + lineInput.value;
    else if (betTypeSel.value === 'moneyline') selectionText = sideLabelText + ' ML';
    else selectionText = sideLabelText + ' ' + (parseFloat(lineInput.value) > 0 ? '+' + lineInput.value : lineInput.value);
    errEl.textContent = '';
    return {
      matchup: matchupText, selection: selectionText,
      placedAt: dateInput.value || null,
      matchedSport: leagueSel.value || null, matchedGameId: g ? g.id : null,
      homeAbbr: g ? g.home : null, awayAbbr: g ? g.away : null,
      betSide: (betTypeSel.value === 'total') ? null : (g ? sideSel.value : null),
      betType: betTypeSel.value
    };
  }

  const addLegBtn = el('button', null, '+ Add parlay leg');
  addLegBtn.style.cssText = 'width:100%;margin-top:10px;background:none;border:1px solid var(--accent);color:var(--accent);font-size:13px;font-weight:700;padding:9px;border-radius:6px;';
  addLegBtn.onclick = () => {
    const leg = buildCurrentLeg();
    if (!leg) return;
    trackerWizardLegs.push(leg);
    render();
  };
  card.appendChild(addLegBtn);

  const addBtn = el('button', 'lock-btn', trackerWizardLegs.length ? `Finish parlay (${trackerWizardLegs.length + 1} legs)` : 'Add this bet');
  addBtn.style.marginTop = '8px';
  addBtn.onclick = () => {
    const leg = buildCurrentLeg();
    if (!leg) return;
    if (!costInput.value) { errEl.textContent = 'Enter the amount bet.'; return; }

    const allLegs = [...trackerWizardLegs, leg];
    const shared = {
      cost: parseFloat(costInput.value) || 0,
      payout: payoutInput.value === '' ? null : parseFloat(payoutInput.value),
      maxPayout: null,
      status: payoutInput.value === '' ? 'open' : 'settled',
      placedAt: leg.placedAt
    };

    if (!kalshiPendingExtraction) kalshiPendingExtraction = [];
    if (allLegs.length === 1) {
      kalshiPendingExtraction.push({ _tempId: 'temp_' + Date.now(), ...leg, ...shared });
    } else {
      const sports = [...new Set(allLegs.map(l => l.matchedSport).filter(Boolean))];
      kalshiPendingExtraction.push({
        _tempId: 'temp_' + Date.now(),
        betType: 'parlay', legs: allLegs,
        matchup: allLegs.length + '-leg parlay',
        selection: allLegs.map(l => l.selection).join(' + '),
        matchedSport: sports.length === 1 ? sports[0] : null,
        matchedGameId: null, homeAbbr: null, awayAbbr: null, betSide: null,
        ...shared
      });
    }
    trackerWizardLegs = [];
    trackerWizardOpen = false;
    render();
  };
  card.appendChild(addBtn);

  const cancelBtn = el('button', null, 'Cancel');
  cancelBtn.style.cssText = 'margin-top:8px;width:100%;background:none;border:1px solid var(--border);color:var(--text-faint);font-size:12px;padding:8px;border-radius:6px;';
  cancelBtn.onclick = () => { trackerWizardOpen = false; trackerWizardLegs = []; render(); };
  card.appendChild(cancelBtn);

  return card;
}

function renderKalshiSection() {
  const wrap = el('div');
  wrap.appendChild(el('div', 'setup-hint', "Log bets from any sportsbook or prediction market — pick the date, league, and real matchup, then just type the line, amount, and payout. Nothing here touches your real accounts."));

      payoutInput.oninput = () => { bet.payout = payoutInput.value === '' ? null : parseFloat(payoutInput.value); };
      row.appendChild(payoutInput);
      card.appendChild(row);

      const statusRow = el('div'); statusRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:8px;';
      statusRow.appendChild(el('label', null, 'Status')).style.cssText = 'font-size:11px;color:var(--text-dim);';

    const saveBtn = el('button', 'lock-btn', 'Save all bets');
    saveBtn.onclick = async () => {
      const invalid = kalshiPendingExtraction.find(b => !b.matchup.trim() || !b.selection.trim() || !b.cost);
      if (invalid) { alert('Fill in matchup, selection, and cost for every bet before saving.'); return; }
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      const newRecords = kalshiPendingExtraction.map(bet => ({
        id: profile.name + '_tracker_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        player: profile.name, poolType: 'tracker',
        matchup: bet.matchup, selection: bet.selection,

      }));
      newRecords.forEach(r => allPicks.push(r));
      try {
        await savePicks(allPicks);
        kalshiPendingExtraction = null;
        render();
      } catch (e) {
        newRecords.forEach(r => { const i = allPicks.findIndex(x => x.id === r.id); if (i > -1) allPicks.splice(i,1); });
        alert("Couldn't save (" + describeFetchError(e) + ") — try again.");

      }
    };

  const allHistory = trackerHistoryChronological(profile.name);

    [['week','This week'], ['month','This month'], ['year','This year'], ['all','All time']].forEach(([mode,label]) => {
      const isSpecificDay = /^\d{4}-\d{2}-\d{2}$/.test(trackerDateFilter);
      const pill = el('button', 'league-pill' + (!isSpecificDay && trackerDateFilter === mode ? ' active' : ''), label);
      pill.onclick = () => { trackerDateFilter = mode; render(); };
      dateScroller.appendChild(pill);
    });
    if (/^\d{4}-\d{2}-\d{2}$/.test(trackerDateFilter)) {
      const dayLabel = new Date(trackerDateFilter + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const pill = el('button', 'league-pill active', dayLabel + ' ✕');
      pill.onclick = () => { trackerDateFilter = 'all'; render(); };
      dateScroller.appendChild(pill);
    }
    wrap.appendChild(dateScroller);

    // league filter chips
    const leaguesPresent = [...new Set(allHistory.map(e => e.p.matchedSport).filter(Boolean))];
    if (leaguesPresent.length) {
      const leagueScroller = el('div', 'league-scroller');
      const allPill = el('button', 'league-pill' + (trackerLeagueFilter === null ? ' active' : ''), 'All leagues');
      allPill.onclick = () => { trackerLeagueFilter = null; trackerTeamFilter = null; render(); };
      leagueScroller.appendChild(allPill);
      leaguesPresent.forEach(sport => {
        const label = (LEAGUES_META.find(l => l.id === sport) || {}).label || sport.toUpperCase();
        const pill = el('button', 'league-pill' + (trackerLeagueFilter === sport ? ' active' : ''), label);
        pill.onclick = () => { trackerLeagueFilter = sport; trackerTeamFilter = null; render(); };
        leagueScroller.appendChild(pill);
      });
      wrap.appendChild(leagueScroller);
    }

    // bet type filter chips
    const typeScroller = el('div', 'league-scroller');
    [['all','All'], ['spread','Spread'], ['total','Total'], ['moneyline','Moneyline'], ['parlay','Parlay']].forEach(([mode,label]) => {
      const pill = el('button', 'league-pill' + (trackerBetTypeFilter === mode ? ' active' : ''), label);
      pill.onclick = () => { trackerBetTypeFilter = mode; render(); };
      typeScroller.appendChild(pill);
    });
    wrap.appendChild(typeScroller);

    // team filter dropdown — only teams you actually bet on within the selected league
    if (trackerLeagueFilter) {
      const teamsPresent = [...new Set(
        allHistory.filter(e => e.p.matchedSport === trackerLeagueFilter && e.p.betSide)
          .map(e => e.p.betSide)
      )].sort();
      if (teamsPresent.length) {
        const teamSel = el('select');
        teamSel.style.cssText = 'width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;font-size:13px;margin:0 0 10px;';
        const anyOpt = document.createElement('option'); anyOpt.value = ''; anyOpt.textContent = 'All teams'; teamSel.appendChild(anyOpt);
        teamsPresent.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; if (trackerTeamFilter === t) o.selected = true; teamSel.appendChild(o); });
        teamSel.onchange = () => { trackerTeamFilter = teamSel.value || null; render(); };
        wrap.appendChild(teamSel);
      }
    }
  }

  const history = allHistory.filter(e => {
    if (!inTrackerDateRange(e.date, trackerDateFilter)) return false;
    if (trackerLeagueFilter && e.p.matchedSport !== trackerLeagueFilter) return false;
    if (trackerTeamFilter && e.p.betSide !== trackerTeamFilter) return false;
    if (trackerBetTypeFilter !== 'all' && e.p.betType !== trackerBetTypeFilter) return false;
    return true;
  });
  const settledEntries = history.filter(e => e.profit !== null);
  const totalProfit = settledEntries.reduce((s,e) => s + e.profit, 0);

  if (allHistory.length) {
    const banner = el('div', 'rank-banner');

    c1.appendChild(el('div', 'rc-label', 'Total profit'));
    c1.appendChild(el('div', 'rc-value', '$' + totalProfit.toFixed(2))).style.color = totalProfit >= 0 ? '#4CAF50' : 'var(--danger)';
    c1.appendChild(el('div', 'rc-sub', settledEntries.length + ' settled bet' + (settledEntries.length === 1 ? '' : 's')));
    banner.appendChild(c1);
    wrap.appendChild(banner);

    const chartCard = el('div', 'event-card');
    chartCard.appendChild(renderProfitChart(trackerDailyTotals(history)));

  }

  wrap.appendChild(el('div', 'week-header', 'Tracked bets'));
  if (!allHistory.length) {
    wrap.appendChild(el('div', 'empty', 'No bets tracked yet — add one above.'));
  } else if (!history.length) {

    history.slice().reverse().forEach(({ p, profit, date }) => {

      else { resTxt = p.maxPayout !== null ? 'up to $' + p.maxPayout.toFixed(2) : 'Open'; cls = 'pending'; }
      rightWrap.appendChild(el('div', 'result ' + cls, resTxt));
      const delBtn = el('button', null, '✕');
      delBtn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-faint);border-radius:6px;width:26px;height:26px;font-size:12px;';
      delBtn.onclick = () => { if (confirm('Remove this tracked bet?')) deletePick(p.id); };
      rightWrap.appendChild(delBtn);
      row.appendChild(rightWrap);
      wrap.appendChild(row);
    });
  }
  return wrap;
}

    scroller.appendChild(pill);
  });

  }

  const games = (DATA[activeSport] || []).filter(g => g.status === 'scheduled');

  }

  return wrap;
}

function myChallengeFor(gameId, betType) {
  return allPicks.find(p => p.poolType === 'challenge' && p.creator === profile.name && p.gameId === gameId && p.betType === betType && p.status !== 'declined');
}
function challengeStatusText(ch) {
  if (ch.status === 'open') return ch.visibility === 'public' ? 'Posted publicly — waiting for someone to accept' : `Sent to ${ch.targetFriend} — waiting for them to accept`;
  if (ch.status === 'declined') return `${ch.targetFriend} declined this challenge`;
  if (ch.status === 'accepted') {
    const r = settlePick(ch);
    if (r.status === 'pending') return `Accepted by ${ch.acceptedBy} — game not final yet`;
    if (r.status === 'push') return `Accepted by ${ch.acceptedBy} — pushed, no units changed hands`;
    const iWon = r.status === 'win';
    return iWon ? `Accepted by ${ch.acceptedBy} — you won ${ch.units}u` : `Accepted by ${ch.acceptedBy} — you lost ${ch.units}u`;
  }
  return ch.status;
}

function renderChallengeRow(ch) {
  const card = el('div', 'event-card');

  card.appendChild(top);
  card.appendChild(el('div', null, ch.gameLabel)).style.cssText = 'font-size:13.5px;font-weight:700;margin-bottom:4px;';
  const spreadTxt = ch.betType === 'spread' ? pickSpreadDisplay(ch) : null;
  const marketTxt = ch.betType === 'total' ? (ch.sideAbbr === 'OVER' ? 'Over' : 'Under') + ' ' + ch.line : ch.sideAbbr + (spreadTxt ? ' ' + spreadTxt : '');
  card.appendChild(el('div', null, `${ch.creator}'s pick: ${marketTxt} · ${ch.units}u`)).style.cssText = 'font-size:12.5px;color:var(--text-dim);margin-bottom:8px;';

  if (ch.status === 'open') {
    if (ch.creator === profile.name) {
      card.appendChild(el('div', 'no-odds-note', ch.visibility === 'public' ? 'Posted publicly — waiting for someone to accept' : `Sent to ${ch.targetFriend} — waiting for a response`));
    } else if (ch.visibility === 'friend' && ch.targetFriend === profile.name) {
      const row = el('div'); row.style.cssText = 'display:flex;gap:8px;';
      const acceptBtn = el('button', 'lock-btn', 'Accept'); acceptBtn.style.flex = '1';
      acceptBtn.onclick = () => acceptChallenge(ch);
      const declineBtn = el('button', null, 'Decline');
      declineBtn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-faint);border-radius:6px;padding:9px 14px;font-size:13px;';
      declineBtn.onclick = () => declineChallenge(ch);
      row.appendChild(acceptBtn); row.appendChild(declineBtn);
      card.appendChild(row);
    } else if (ch.visibility === 'public') {
      const acceptBtn = el('button', 'lock-btn', 'Accept challenge');
      acceptBtn.onclick = () => acceptChallenge(ch);
      card.appendChild(acceptBtn);
    } else {
      card.appendChild(el('div', 'no-odds-note', 'Not visible to you'));
    }
  } else if (ch.status === 'declined') {
    card.appendChild(el('div', 'no-odds-note', `${ch.targetFriend} declined this challenge`));
  } else if (ch.status === 'accepted') {
    const r = settlePick(ch);
    const iAmCreator = ch.creator === profile.name;
    const myOutcome = r.status === 'pending' ? 'pending' : r.status === 'push' ? 'push' : (iAmCreator ? r.status : (r.status === 'win' ? 'loss' : 'win'));
    let txt, color;
    if (myOutcome === 'pending') { txt = `Accepted by ${ch.acceptedBy} — game not final yet`; color = 'var(--gold)'; }
    else if (myOutcome === 'push') { txt = 'Pushed — no units changed hands'; color = 'var(--gold)'; }
    else {
      const opponent = iAmCreator ? ch.acceptedBy : ch.creator;
      txt = myOutcome === 'win' ? `You won ${ch.units}u vs ${opponent}` : `You lost ${ch.units}u vs ${opponent}`;

    }

function generateHouseChallenges(limit) {
  const pool = [];
  LEAGUES_META.filter(l => l.active).forEach(lg => {
    (DATA[lg.id] || []).forEach(g => {
      if (g.status !== 'scheduled') return;
      const spreadVal = computeSpread(lg.id, g);
      if (spreadVal !== null) {
        const side = Math.random() < 0.5 ? g.home : g.away;
        const line = side === g.home ? spreadVal : -spreadVal;
        pool.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, betType: 'spread', side, line, spreadLabel: spreadLabelForSide(lg.id, g, side) });
      }
      const totalVal = g.overUnder;
      if (totalVal !== null && totalVal !== undefined) {
        const side = Math.random() < 0.5 ? 'OVER' : 'UNDER';
        pool.push({ sport: lg.id, gameId: g.id, gameLabel: g.away + ' @ ' + g.home, betType: 'total', side, line: totalVal, spreadLabel: null });
      }
    });
  });
  const existingKeys = new Set(
    allPicks.filter(p => p.poolType === 'challenge' && p.creator === 'House' && p.status === 'open')
      .map(p => p.gameId + '_' + p.betType)
  );
  const fresh = pool.filter(o => !existingKeys.has(o.gameId + '_' + o.betType));
  for (let i = fresh.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fresh[i], fresh[j]] = [fresh[j], fresh[i]]; }
  const chosen = fresh.slice(0, limit || 100);
  return chosen.map(o => ({
    id: 'house_challenge_' + o.gameId + '_' + o.betType + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    poolType: 'challenge', creator: 'House',
    sport: o.sport, gameId: o.gameId, gameLabel: o.gameLabel,
    betType: o.betType, sideAbbr: o.side, units: 1 + Math.floor(Math.random() * 3), line: o.line, spreadLabel: o.spreadLabel,
    visibility: 'public', targetFriend: null, status: 'open', acceptedBy: null,
    timestamp: new Date().toISOString()
  }));
}

async function topUpHouseChallenges() {
  const openCount = allPicks.filter(p => p.poolType === 'challenge' && p.creator === 'House' && p.status === 'open').length;
  const needed = 100 - openCount;
  if (needed <= 0) return;
  const recs = generateHouseChallenges(needed);
  if (!recs.length) return;
  recs.forEach(r => allPicks.push(r));
  try { await savePicks(allPicks); } catch (e) { /* best-effort; will retry next load */ }
}

async function acceptChallenge(ch) {
  const idx = allPicks.findIndex(p => p.id === ch.id);
  if (idx === -1) return;
  const prev = { ...allPicks[idx] };
  allPicks[idx].status = 'accepted';
  allPicks[idx].acceptedBy = profile.name;
  try { await savePicks(allPicks); render(); }
  catch (e) { allPicks[idx] = prev; alert("Couldn't accept (" + describeFetchError(e) + ") — try again."); render(); }
}
async function declineChallenge(ch) {
  const idx = allPicks.findIndex(p => p.id === ch.id);
  if (idx === -1) return;
  const prev = { ...allPicks[idx] };
  allPicks[idx].status = 'declined';
  try { await savePicks(allPicks); render(); }

}

function renderGameCard(g, sport, meta) {
  const st = statusInfo(g.status, g.liveDetail);
  const home = g.teams[g.home], away = g.teams[g.away];
  const completed = st.text === 'Final';
  const inProgress = g.status === 'inprogress';
  const homeScore = g.score ? g.score[g.home] : undefined;
  const awayScore = g.score ? g.score[g.away] : undefined;
  const homeWon = completed && homeScore > awayScore;
  const awayWon = completed && awayScore > homeScore;

  const card = el('div', 'event-card');
  const top = el('div', 'event-top');
  top.appendChild(el('span', 'event-meta' + (st.live ? ' live' : ''), st.text));
  top.appendChild(el('span', 'event-meta', g.title || g.local_start));
  card.appendChild(top);

  [{ ab: g.away, t: away, sc: awayScore, won: awayWon, lost: homeWon },
   { ab: g.home, t: home, sc: homeScore, won: homeWon, lost: awayWon }].forEach(row => {
    const r = el('div', 'team-row' + (row.won ? ' winner' : row.lost ? ' loser' : ''));
    r.appendChild(el('span', 'team-name', row.t.name));
    r.appendChild(el('span', 'team-score', row.sc !== undefined ? row.sc : ''));
    card.appendChild(r);
  });
  if (sport === 'mlb' && (g.awayPitcher || g.homePitcher)) {
    card.appendChild(el('div', null, `${g.awayPitcher || 'TBD'} vs ${g.homePitcher || 'TBD'}`)).style.cssText = 'font-size:11px;color:var(--text-faint);margin:-2px 0 8px;';
  }

  if (completed) {
    card.appendChild(el('div', 'no-odds-note', 'Game already final — no challenge possible'));
    return card;
  }
  if (inProgress) {
    card.appendChild(el('div', 'no-odds-note', 'Game already in progress — challenges closed'));
    return card;
  }

  const spread = computeSpread(sport, g);
  const totalVal = g.overUnder;
  const favSide = spread !== null ? (spread <= 0 ? g.home : g.away) : null;

  function renderPoolMarket(label, betType, hasMarket, defaultMagnitude, computeOptions) {
    const section = el('div');
    section.style.cssText = 'margin-top:10px;padding-top:10px;border-top:1px solid var(--border);';
    section.appendChild(el('div', null, label)).style.cssText = 'font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.03em;font-weight:700;margin-bottom:6px;';
    if (!hasMarket) { section.appendChild(el('div', 'no-odds-note', 'No ' + label.toLowerCase() + ' posted')); return section; }

    const existing = myChallengeFor(g.id, betType);
    if (existing) {
      const note = el('div', 'locked-note');
      const spreadTxt = betType === 'spread' ? pickSpreadDisplay(existing) : null;
      const marketTxt = betType === 'total' ? (existing.sideAbbr === 'OVER' ? 'Over' : 'Under') + ' ' + existing.line : existing.sideAbbr + (spreadTxt ? ' ' + spreadTxt : '');
      note.innerHTML = `<div class="ln-title">Your challenge</div>${marketTxt} · <b>${existing.units}u</b><div style="margin-top:4px;font-size:11.5px;color:var(--text-dim);">${challengeStatusText(existing)}</div>`;
      section.appendChild(note);
      return section;
    }

    let magnitude = defaultMagnitude;
    const key = g.id + '_' + betType;
    const grid = el('div', 'outcome-grid');
    section.appendChild(grid);

    function rebuildGrid() {
      grid.innerHTML = '';
      computeOptions(magnitude).forEach(opt => {
        const btn = el('div', 'outcome-btn' + (selectedSide[key] === opt.side ? ' selected' : ''));
        btn.innerHTML = `<div class="oc-team">${opt.team}</div><div class="oc-line">${opt.label}</div>`;
        btn.onclick = () => {
          selectedSide[key] = opt.side;
          grid.querySelectorAll('.outcome-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          createBtn.disabled = false;
        };
        grid.appendChild(btn);
      });
    }

    const adjustBtn = el('button', null, `\u270f\ufe0f Adjust ${betType === 'total' ? 'Total' : 'Line'}`);
    adjustBtn.style.cssText = 'width:100%;margin-top:8px;background:none;border:1px dashed var(--border);color:var(--text-dim);border-radius:6px;padding:8px;font-size:12px;font-weight:700;';
    const adjustPanel = el('div');
    adjustPanel.style.cssText = 'display:none;margin-top:8px;gap:8px;align-items:center;';
    const adjustInput = el('input'); adjustInput.type = 'number'; adjustInput.step = '0.5'; adjustInput.value = magnitude !== null ? magnitude : '';
    adjustInput.style.cssText = 'flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;font-size:13px;';
    const applyBtn = el('button', null, 'Apply');
    applyBtn.style.cssText = 'background:var(--accent-dark);border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;';
    adjustPanel.appendChild(adjustInput); adjustPanel.appendChild(applyBtn);
    adjustBtn.onclick = () => { adjustPanel.style.display = adjustPanel.style.display === 'none' ? 'flex' : 'none'; };
    applyBtn.onclick = () => {
      const val = parseFloat(adjustInput.value);
      if (isNaN(val) || val < 0) return;
      magnitude = val;
      rebuildGrid();
    };
    if (defaultMagnitude !== null) {
      section.appendChild(adjustBtn);
      section.appendChild(adjustPanel);
    }
    rebuildGrid();

    const slip = el('div', 'bet-slip');
    const bsRow = el('div', 'bs-row');
    bsRow.appendChild(el('label', null, 'Units'));
    const unitsInput = el('input'); unitsInput.type = 'number'; unitsInput.min = '0.5'; unitsInput.step = '0.5'; unitsInput.value = '1';
    bsRow.appendChild(unitsInput);
    slip.appendChild(bsRow);

    const visSel = el('select');
    visSel.style.cssText = 'width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px;font-size:13px;margin:8px 0;box-sizing:border-box;';
    const publicOpt = document.createElement('option'); publicOpt.value = ''; publicOpt.textContent = '\ud83d\udce2 Post publicly'; visSel.appendChild(publicOpt);
    players.filter(p => p !== profile.name).forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = '\ud83d\udc64 Send to ' + p; visSel.appendChild(o); });
    slip.appendChild(visSel);

    const createBtn = el('button', 'lock-btn', 'Select a side');
    createBtn.disabled = true;
    slip.appendChild(createBtn);
    const errEl = el('div', 'pick-error');
    slip.appendChild(errEl);
    section.appendChild(slip);

    createBtn.onclick = async () => {
      const side = selectedSide[key];
      const units = parseFloat(unitsInput.value);
      errEl.textContent = '';
      if (!side) { errEl.textContent = 'Pick a side first.'; return; }
      if (!units || units <= 0) { errEl.textContent = 'Enter a valid unit amount.'; return; }
      const friend = visSel.value || null;
      let line, spreadLabel;
      if (betType === 'total') {
        line = magnitude;
        spreadLabel = null;
      } else {
        const isFav = side === favSide;
        spreadLabel = magnitude === 0 ? 'PK' : (isFav ? '-' + magnitude : '+' + magnitude);
        line = magnitude === 0 ? 0 : (isFav ? -magnitude : magnitude);
      }
      const challenge = {
        id: profile.name + '_challenge_' + g.id + '_' + betType + '_' + Date.now(),
        poolType: 'challenge', creator: profile.name,
        sport, gameId: g.id, gameLabel: g.away + ' @ ' + g.home,
        betType, sideAbbr: side, units, line, spreadLabel,
        visibility: friend ? 'friend' : 'public',
        targetFriend: friend, status: 'open', acceptedBy: null,
        timestamp: new Date().toISOString()
      };
      createBtn.disabled = true; createBtn.textContent = 'Saving…';
      allPicks.push(challenge);
      let lastErr = null;
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          await savePicks(allPicks);
          lastErr = null;
          break;
        } catch (e) { lastErr = e; }
      }
      if (lastErr) {
        allPicks.pop();
        createBtn.disabled = false; createBtn.textContent = friend ? 'Send to ' + friend : 'Post publicly';
        errEl.textContent = "Couldn't save (" + describeFetchError(lastErr) + ") — try again.";
      } else {
        render();
      }
    };
    visSel.onchange = () => { createBtn.textContent = visSel.value ? 'Send to ' + visSel.value : 'Post publicly'; };
    return section;
  }

  card.appendChild(renderPoolMarket('Spread', 'spread', spread !== null, spread !== null ? Math.abs(spread) : null, (magnitude) => {
    if (magnitude === null) return [{ side: g.away, team: g.away, label: 'ML' }, { side: g.home, team: g.home, label: 'ML' }];
    const favLabel = magnitude === 0 ? 'PK' : '-' + magnitude;
    const udLabel = magnitude === 0 ? 'PK' : '+' + magnitude;
    return [g.away, g.home].map(ab => ({ side: ab, team: ab, label: ab === favSide ? favLabel : udLabel }));
  }));
  card.appendChild(renderPoolMarket('Total', 'total', totalVal !== null && totalVal !== undefined, totalVal !== null && totalVal !== undefined ? totalVal : null, (magnitude) => {
    if (magnitude === null) return [{ side: 'OVER', team: 'Over', label: '—' }, { side: 'UNDER', team: 'Under', label: '—' }];
    return [{ side: 'OVER', team: 'Over', label: String(magnitude) }, { side: 'UNDER', team: 'Under', label: String(magnitude) }];
  }));
  return card;
}

function parseSpreadLabel(label) {
  if (label === undefined || label === null) return null;
  if (label === 'PK') return 0;
  const n = parseFloat(label);
  return isNaN(n) ? null : n;
}
function settlePick(p) {
  if (p.settledResult) return p.settledResult;
  const idx = gameIndex[p.gameId];
  if (!idx) return { status: 'pending' };
  const g = idx.game;
  if (g.status !== 'closed' && g.status !== 'complete') return { status: 'pending' };
  const homeScore = g.score?.[g.home], awayScore = g.score?.[g.away];
  if (homeScore === undefined || awayScore === undefined) return { status: 'pending' };

  let outcome;
  if (p.betType === 'total') {
    const total = homeScore + awayScore;
    const diff = total - p.line;
    if (diff === 0) outcome = 'push';
    else outcome = p.sideAbbr === 'OVER' ? (diff > 0 ? 'win' : 'loss') : (diff < 0 ? 'win' : 'loss');
  } else {
    const spreadVal = parseSpreadLabel(p.spreadLabel);
    if (spreadVal !== null) {
      const teamScore = p.sideAbbr === g.home ? homeScore : awayScore;
      const oppScore = p.sideAbbr === g.home ? awayScore : homeScore;
      const margin = (teamScore - oppScore) + spreadVal;
      outcome = margin > 0 ? 'win' : (margin < 0 ? 'loss' : 'push');
    } else {
      const winnerAbbr = homeScore > awayScore ? g.home : (awayScore > homeScore ? g.away : null);
      outcome = winnerAbbr === null ? 'push' : (winnerAbbr === p.sideAbbr ? 'win' : 'loss');
    }
  }
  if (outcome === 'push') return { status: 'push' };
  return { status: outcome, profit: outcome === 'win' ? p.units : -p.units };
}
async function persistNewlySettledPicks() {
  let changed = false;
  allPicks.forEach(p => {
    if (p.settledResult) return;
    if (!(p.units > 0 && p.sideAbbr)) return; // nothing to settle (e.g. a daily-round entry never bet on)
    const r = settlePick(p);
    if (r.status !== 'pending') { p.settledResult = r; changed = true; }
  });
  if (changed) {
    try { await savePicks(allPicks); } catch (e) { /* best-effort; will retry next cycle */ }
  }
  return changed;
}
function potentialWin(p) { return p.units; }

function poolOnly(list) { return list.filter(p => p.poolType !== 'daily' && p.poolType !== 'weekly' && p.poolType !== 'tracker' && p.poolType !== 'kalshi' && p.poolType !== 'challenge' && p.poolType !== 'mulligan'); }
async function migrateLegacyWeeklyPicks() {
  let changed = false;
  allPicks.forEach(p => {
    if (p.betType && !p.poolType) { p.poolType = 'weekly'; changed = true; }
  });
  if (changed) { try { await savePicks(allPicks); } catch (e) { /* best-effort; will retry next load */ } }
}
async function cleanupStaleHouseBets() {
  const today = houseDayKey(new Date());
  const yesterday = houseDayKey(new Date(Date.now() - 86400000));
  const before = allPicks.length;
  allPicks = allPicks.filter(p => !(p.poolType === 'weekly' && !p.settledResult && p.weekKey !== today && p.weekKey !== yesterday));
  if (allPicks.length !== before) { try { await savePicks(allPicks); } catch (e) { /* best-effort; will retry next load */ } }
}
function currentProfit(name) {
  return poolOnly(allPicks.filter(p => p.player === name)).reduce((s,p) => {
    const r = settlePick(p);
    if (r.status === 'win' || r.status === 'loss') return s + r.profit;
    return s;
  }, 0);
}
function potentialProfit(name) {
  return poolOnly(allPicks.filter(p => p.player === name)).reduce((s,p) => {
    const r = settlePick(p);
    if (r.status === 'win' || r.status === 'loss') return s + r.profit;
    if (r.status === 'pending') return s + potentialWin(p);
    return s;
  }, 0);
}
function rankAmong(valueForName) {
  const pool = players.length ? players.slice() : [profile.name];
  if (!pool.includes(profile.name)) pool.push(profile.name);
  const arr = pool.map(name => ({ name, val: valueForName(name) }));
  arr.sort((a,b) => b.val - a.val);
  const idx = arr.findIndex(x => x.name === profile.name);
  return { rank: idx + 1, total: arr.length };
}

function isOrphaned(p) { if (p.poolType === 'kalshi' || p.poolType === 'tracker' || p.poolType === 'mulligan') return false; return !gameIndex[p.gameId]; }

async function deletePick(pickId) {
  const idx = allPicks.findIndex(p => p.id === pickId);
  if (idx === -1) return;
  const removed = allPicks.splice(idx, 1)[0];
  try {
    await savePicks(allPicks);
    render();
  } catch (e) {
    allPicks.splice(idx, 0, removed);
    alert("Couldn't delete that bet (" + describeFetchError(e) + ") — try again.");
    render();
  }
}
async function clearOrphanedPicks() {
  const kept = allPicks.filter(p => !isOrphaned(p));
  const removedCount = allPicks.length - kept.length;
  const prevPicks = allPicks;
  allPicks = kept;
  try {
    await savePicks(allPicks);
    render();
  } catch (e) {
    allPicks = prevPicks;
    alert("Couldn't clear those bets (" + describeFetchError(e) + ") — try again.");
    render();
  }
}

function pickDate(p) {
  const idx = gameIndex[p.gameId];
  return idx ? new Date(idx.game.start) : new Date(p.timestamp);
}
function sortPicks(list, mode) {
  const arr = list.slice();
  if (mode === 'date_desc') arr.sort((a,b) => pickDate(b) - pickDate(a));
  else if (mode === 'date_asc') arr.sort((a,b) => pickDate(a) - pickDate(b));
  else if (mode === 'units_desc') arr.sort((a,b) => b.units - a.units);
  else if (mode === 'units_asc') arr.sort((a,b) => a.units - b.units);
  return arr;
}

function settledPicksSorted(name) {
  return poolOnly(allPicks.filter(p => p.player === name))
    .map(p => ({ p, r: settlePick(p), start: gameIndex[p.gameId] ? new Date(gameIndex[p.gameId].game.start) : new Date(p.timestamp) }))
    .filter(x => x.r.status === 'win' || x.r.status === 'loss')
    .sort((a, b) => a.start - b.start);
}
function recordFor(entries) {
  let w = 0, l = 0, net = 0;
  entries.forEach(x => { if (x.r.status === 'win') { w++; net += x.r.profit; } else { l++; net += x.r.profit; } });
  const total = w + l;
  return { w, l, total, winPct: total ? (w / total) * 100 : 0, net };
}
function winPctTrendSVG(entries) {
  if (!entries.length) return '<div class="empty" style="padding:24px 10px;">No settled bets yet.</div>';
  const w = 320, h = 130, padL = 30, padR = 8, padT = 10, padB = 18;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  let wins = 0;
  const pts = entries.map((x, i) => { if (x.r.status === 'win') wins++; return { x: i, y: (wins / (i + 1)) * 100 }; });
  const n = pts.length;
  const xScale = i => padL + (n <= 1 ? innerW / 2 : (i / (n - 1)) * innerW);
  const yScale = pct => padT + innerH - (pct / 100) * innerH;
  const d = pts.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i).toFixed(1)} ${yScale(pt.y).toFixed(1)}`).join(' ');
  const y50 = padT + innerH / 2;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}" style="stroke:var(--border)" stroke-width="1"/>
    <line x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}" style="stroke:var(--border)" stroke-width="1"/>
    <line x1="${padL}" y1="${y50}" x2="${padL + innerW}" y2="${y50}" style="stroke:var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="2" y="${padT + 6}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">100</text>
    <text x="6" y="${y50 + 3}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">50</text>
    <text x="10" y="${padT + innerH + 3}" font-size="9" style="fill:var(--text-faint)" font-family="var(--font-mono)">0</text>
    <path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2"/>
  </svg>`;
}
function leagueBarsSVG(rows) {
  if (!rows.length) return '<div class="empty" style="padding:24px 10px;">No settled bets yet.</div>';
  const w = 320, rowH = 26, h = rows.length * rowH + 8;
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.net)));
  const mid = w / 2, halfTrack = w / 2 - 56;
  let bars = '';
  rows.forEach((r, i) => {
    const y = 6 + i * rowH;
    const barW = (Math.abs(r.net) / maxAbs) * halfTrack;
    const x = r.net >= 0 ? mid : mid - barW;
    const color = r.net > 0 ? 'var(--accent)' : (r.net < 0 ? 'var(--danger)' : 'var(--text-faint)');
    bars += `<rect x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="14" rx="2" style="fill:${color}"/>`;
    bars += `<text x="6" y="${y + 11}" font-size="10.5" style="fill:var(--text-dim)" font-family="var(--font-head)" font-weight="700">${r.label}</text>`;
    bars += `<text x="${w - 6}" y="${y + 11}" font-size="10.5" text-anchor="end" style="fill:var(--text)" font-family="var(--font-mono)">${fmtUnits(r.net)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet">
    <line x1="${mid}" y1="0" x2="${mid}" y2="${h}" style="stroke:var(--border)"/>
    ${bars}
  </svg>`;
}

  wrap.appendChild(table);

  wrap.appendChild(el('div', 'week-header', 'Net units by league'));
  const barsCard = el('div', 'event-card');
  barsCard.innerHTML = leagueBarsSVG(leagueRows.map(r => ({ label: r.label, net: r.net })));
  wrap.appendChild(barsCard);

  return wrap;
}

function filteredSettledFor(name, dateMode, leagueId) {
  return poolOnly(allPicks.filter(p => p.player === name))
    .map(p => ({ p, r: settlePick(p), date: gameIndex[p.gameId] ? new Date(gameIndex[p.gameId].game.start) : new Date(p.timestamp) }))
    .filter(x => x.r.status === 'win' || x.r.status === 'loss')
    .filter(x => inDateRange(x.date, dateMode))
    .filter(x => leagueId === null || x.p.sport === leagueId);
}

function renderLeaderboard() {
  const wrap = el('div');
  const names = players.length ? players.slice() : [];
  if (profile && !names.includes(profile.name)) names.push(profile.name);

  // date range chips
  const dateScroller = el('div', 'league-scroller');
  [['day','Today'], ['week','This week'], ['year','This year'], ['all','All-time']].forEach(([mode,label]) => {
    const pill = el('button', 'league-pill' + (lbDateMode === mode ? ' active' : ''), label);
    pill.onclick = () => { lbDateMode = mode; render(); };
    dateScroller.appendChild(pill);
  });
  wrap.appendChild(dateScroller);

  // league filter chips
  const leaguesPresent = [...new Set(poolOnly(allPicks).map(p => p.sport))];
  if (leaguesPresent.length) {
    const leagueScroller = el('div', 'league-scroller');
    const allPill = el('button', 'league-pill' + (lbLeagueFilter === null ? ' active' : ''), 'All leagues');
    allPill.onclick = () => { lbLeagueFilter = null; render(); };
    leagueScroller.appendChild(allPill);
    leaguesPresent.forEach(sport => {
      const label = (LEAGUES_META.find(l => l.id === sport) || {}).label || (sport || 'sport').toUpperCase();
      const pill = el('button', 'league-pill' + (lbLeagueFilter === sport ? ' active' : ''), label);
      pill.onclick = () => { lbLeagueFilter = sport; render(); };
      leagueScroller.appendChild(pill);
    });
    wrap.appendChild(leagueScroller);
  }

  const ranked = names.map(name => {
    const entries = filteredSettledFor(name, lbDateMode, lbLeagueFilter);
    const rec = recordFor(entries);
    return { name, profit: rec.net, rec };
  }).sort((a,b) => b.profit - a.profit);

  if (!ranked.length || ranked.every(r => r.rec.total === 0)) {
    wrap.appendChild(el('div', 'empty', 'No settled bets in this range yet.'));
    wrap.appendChild(el('div', 'refresh-note', 'Payouts are flat 1:1 — win a pick, gain the units risked; lose it, drop the same amount.'));
    return wrap;
  }
  ranked.forEach((r, i) => {
    const row = el('div', 'lb-row' + (profile && r.name === profile.name ? ' me' : ''));
    row.appendChild(el('div', 'lb-rank' + (i === 0 && r.profit > 0 ? ' first' : ''), (i+1).toString()));
    const nameWrap = el('div', 'lb-name', r.name);
    row.appendChild(nameWrap);
    row.appendChild(el('div', 'lb-record', `${r.rec.w}-${r.rec.l}`));
    row.appendChild(el('div', 'lb-profit ' + (r.profit > 0 ? 'pos' : r.profit < 0 ? 'neg' : ''), fmtUnits(r.profit)));
    wrap.appendChild(row);
  });
  wrap.appendChild(el('div', 'refresh-note', 'Payouts are flat 1:1 — win a pick, gain the units risked; lose it, drop the same amount. Scores are checked live from ESPN, so standings update automatically as games finish.'));
  return wrap;
}

(async function init() {
  loadProfile();
  if (profile) {
    try {
      const g = await loadGlobalData();
      players = g.players; allPicks = g.picks;
      await migrateLegacyWeeklyPicks();
      await cleanupStaleHouseBets();
      if (!players.includes(profile.name)) { players.push(profile.name); await savePlayers(players); }
      await refreshGameLists();
      await topUpHouseChallenges();
      startPolling();
      startLiveScoreChecks();
    } catch (e) {
      setupError = "Had trouble connecting to the shared board (" + describeFetchError(e) + ") — you can still continue.";
    }
  }
  render();
})();
</script>
</body>
</html>
